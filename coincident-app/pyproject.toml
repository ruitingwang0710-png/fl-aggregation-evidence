[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coincident-app"
version = "1.0.0"
description = "One round of Krum over the coincident fixture"
dependencies = ["flwr[simulation]==1.33.0", "numpy>=2.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["coincident_app"]

[tool.flwr.app]
publisher = "walkthrough"

[tool.flwr.app.components]
serverapp = "coincident_app.server_app:app"
clientapp = "coincident_app.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 1


